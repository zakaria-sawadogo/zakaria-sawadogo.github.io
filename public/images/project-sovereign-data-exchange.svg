<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- dashed federated links -->
  <g stroke="#12635d" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="7 7">
    <path d="M200 150 L110 92"/>
    <path d="M200 150 L290 92"/>
    <path d="M200 150 L200 232"/>
  </g>

  <!-- central secure exchange hub -->
  <g transform="translate(200,150)">
    <circle r="46" fill="#12635d" fill-opacity="0.10" stroke="#12635d" stroke-width="6"/>
    <rect x="-18" y="-6" width="36" height="28" rx="6" fill="#12635d"/>
    <path d="M-10 -6 V-18 C-10 -30 10 -30 10 -18 V-6" stroke="#12635d" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="4.5" fill="#fbfbf8"/>
  </g>

  <!-- health institution node -->
  <g transform="translate(110,92)">
    <circle r="30" fill="#9a5b13" fill-opacity="0.12" stroke="#9a5b13" stroke-width="5"/>
    <rect x="-4" y="-14" width="8" height="28" rx="2" fill="#9a5b13"/>
    <rect x="-14" y="-4" width="28" height="8" rx="2" fill="#9a5b13"/>
  </g>

  <!-- education institution node -->
  <g transform="translate(290,92)">
    <circle r="30" fill="#9a5b13" fill-opacity="0.12" stroke="#9a5b13" stroke-width="5"/>
    <path d="M-18 -6 L0 -16 L18 -6 L0 4 Z" fill="#9a5b13"/>
    <path d="M-10 -1 V12 C-10 18 10 18 10 12 V-1" stroke="#9a5b13" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- public-service institution node -->
  <g transform="translate(200,232)">
    <circle r="30" fill="#9a5b13" fill-opacity="0.12" stroke="#9a5b13" stroke-width="5"/>
    <rect x="-16" y="-14" width="32" height="24" rx="3" fill="#9a5b13"/>
    <rect x="-6" y="-20" width="12" height="8" rx="2" fill="#9a5b13"/>
    <rect x="-4" y="-2" width="8" height="10" fill="#fbfbf8"/>
  </g>

  <!-- background privacy glyphs -->
  <g fill="#12635d" fill-opacity="0.5" font-family="monospace" font-size="12">
    <text x="30" y="200">01</text>
    <text x="30" y="216">10</text>
  </g>
  <g stroke="#12635d" stroke-width="4" fill="none" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M348 190 a30 30 0 1 1 0 0.1"/>
    <path d="M348 210 a14 14 0 1 1 0.1 0"/>
  </g>
</svg>
