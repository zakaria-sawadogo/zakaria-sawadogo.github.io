<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- background network nodes -->
  <g stroke="#12635d" stroke-width="2" stroke-opacity="0.25">
    <path d="M40 60 L90 100 M360 50 L310 95 M40 240 L95 205 M360 250 L305 210"/>
  </g>
  <g fill="#12635d" fill-opacity="0.3">
    <circle cx="40" cy="60" r="6"/>
    <circle cx="360" cy="50" r="6"/>
    <circle cx="40" cy="240" r="6"/>
    <circle cx="360" cy="250" r="6"/>
  </g>

  <!-- central shield -->
  <path d="M200 40 L268 66 V140 C268 190 236 224 200 240 C164 224 132 190 132 140 V66 Z" fill="#12635d" fill-opacity="0.10" stroke="#12635d" stroke-width="6" stroke-linejoin="round"/>

  <!-- lock inside shield -->
  <rect x="176" y="128" width="48" height="38" rx="6" fill="#12635d"/>
  <path d="M186 128 V112 C186 99 214 99 214 112 V128" stroke="#12635d" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="145" r="6" fill="#fbfbf8"/>
  <rect x="197" y="145" width="6" height="12" rx="2" fill="#fbfbf8"/>

  <!-- orbiting security glyphs -->
  <g fill="#12635d">
    <!-- fingerprint arcs (left) -->
    <path d="M76 150 a34 34 0 1 1 0 0.1" stroke="#12635d" stroke-width="4" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>
    <path d="M76 168 a16 16 0 1 1 0.1 0" stroke="#12635d" stroke-width="4" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- binary code panel (right) -->
  <g fill="#12635d" fill-opacity="0.55" font-family="monospace" font-size="13">
    <text x="288" y="140">01</text>
    <text x="288" y="158">10</text>
    <text x="288" y="176">11</text>
  </g>

  <!-- small padlock badge top-right -->
  <g transform="translate(300,90)">
    <rect x="-14" y="0" width="28" height="22" rx="5" fill="#12635d" fill-opacity="0.85"/>
    <path d="M-8 0 V-8 C-8 -17 8 -17 8 -8 V0" stroke="#12635d" stroke-width="5" fill="none" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>

  <!-- alert / scan wave (left) -->
  <g stroke="#12635d" stroke-opacity="0.4" stroke-width="3" fill="none">
    <path d="M60 210 q20 -18 40 0"/>
    <path d="M55 222 q26 -24 52 0"/>
  </g>
</svg>
