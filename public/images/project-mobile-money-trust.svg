<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- radar scan behind phone -->
  <g stroke="#12635d" stroke-width="3" stroke-opacity="0.28" fill="none">
    <circle cx="200" cy="150" r="86"/>
    <circle cx="200" cy="150" r="60"/>
  </g>
  <path d="M200 150 L200 64 A86 86 0 0 1 260 90 Z" fill="#12635d" fill-opacity="0.10"/>

  <!-- phone body -->
  <rect x="160" y="90" width="80" height="150" rx="14" fill="none" stroke="#12635d" stroke-width="6"/>
  <rect x="168" y="106" width="64" height="106" rx="4" fill="#12635d" fill-opacity="0.10"/>
  <circle cx="200" cy="226" r="5" fill="#12635d"/>

  <!-- coin / currency glyph on screen -->
  <g transform="translate(200,148)">
    <circle r="26" fill="#9a5b13" fill-opacity="0.15" stroke="#9a5b13" stroke-width="5"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#9a5b13" text-anchor="middle">$</text>
  </g>

  <!-- trust shield badge -->
  <g transform="translate(150,222)">
    <path d="M0 -20 L20 -12 V4 C20 20 8 30 0 34 C-8 30 -20 20 -20 4 V-12 Z" fill="#12635d"/>
    <path d="M-8 4 l6 7 l14 -16" stroke="#fbfbf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- peer phone nodes across the network -->
  <g stroke="#12635d" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="6 6">
    <path d="M160 116 L86 74"/>
    <path d="M240 200 L322 232"/>
  </g>
  <g transform="translate(78,64)">
    <rect x="-14" y="-22" width="28" height="44" rx="6" fill="#9a5b13" fill-opacity="0.85"/>
    <rect x="-9" y="-15" width="18" height="28" rx="2" fill="#fbfbf8"/>
  </g>
  <g transform="translate(332,244)">
    <rect x="-14" y="-22" width="28" height="44" rx="6" fill="#9a5b13" fill-opacity="0.85"/>
    <rect x="-9" y="-15" width="18" height="28" rx="2" fill="#fbfbf8"/>
  </g>
</svg>
