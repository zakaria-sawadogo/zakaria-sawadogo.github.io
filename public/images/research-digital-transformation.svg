<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- cloud platform base -->
  <path d="M110 210 a30 30 0 0 1 6 -59 a42 42 0 0 1 82 -14 a34 34 0 0 1 8 67 Z" fill="#12635d" fill-opacity="0.10" stroke="#12635d" stroke-width="5" stroke-linejoin="round"/>

  <!-- rocket launching from cloud -->
  <g transform="translate(200,60) rotate(0)">
    <!-- body -->
    <path d="M0 -30 C18 -14 18 40 0 66 C-18 40 -18 -14 0 -30 Z" fill="#12635d"/>
    <!-- window -->
    <circle cx="0" cy="10" r="10" fill="#fbfbf8"/>
    <circle cx="0" cy="10" r="6" fill="#12635d"/>
    <!-- fins -->
    <path d="M0 40 L-22 66 L0 58 Z" fill="#9a5b13"/>
    <path d="M0 40 L22 66 L0 58 Z" fill="#9a5b13"/>
    <!-- flame -->
    <path d="M-8 66 C-8 84 8 84 8 66 C8 78 -8 78 -8 66 Z" fill="#9a5b13" fill-opacity="0.85"/>
  </g>

  <!-- motion trail -->
  <g stroke="#12635d" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <path d="M170 130 q30 20 60 0"/>
    <path d="M160 155 q40 26 80 0"/>
  </g>

  <!-- upward arrow chart to the right -->
  <g stroke="#12635d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 220 L300 120"/>
    <path d="M286 138 L300 118 L316 138"/>
  </g>
  <g fill="#12635d" fill-opacity="0.55">
    <rect x="270" y="200" width="14" height="20" rx="3"/>
    <rect x="270" y="200" width="14" height="20" rx="3" transform="translate(0,0)"/>
  </g>

  <!-- growth bars near base -->
  <g fill="#12635d" fill-opacity="0.5">
    <rect x="70" y="230" width="14" height="26" rx="3"/>
    <rect x="92" y="216" width="14" height="40" rx="3"/>
    <rect x="114" y="200" width="14" height="56" rx="3"/>
  </g>

  <!-- connectivity dots -->
  <g fill="#12635d" fill-opacity="0.4">
    <circle cx="330" cy="70" r="5"/>
    <circle cx="350" cy="100" r="4"/>
    <circle cx="60" cy="80" r="5"/>
  </g>
</svg>
