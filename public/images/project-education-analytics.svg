<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- dashboard frame -->
  <rect x="80" y="60" width="240" height="150" rx="10" fill="#9a5b13" fill-opacity="0.08" stroke="#9a5b13" stroke-width="5"/>
  <rect x="80" y="60" width="240" height="26" rx="10" fill="#9a5b13" fill-opacity="0.5"/>
  <circle cx="96" cy="73" r="4" fill="#fbfbf8"/>
  <circle cx="110" cy="73" r="4" fill="#fbfbf8"/>
  <circle cx="124" cy="73" r="4" fill="#fbfbf8"/>

  <!-- bar chart panel -->
  <g fill="#9a5b13">
    <rect x="102" y="150" width="18" height="40" rx="3"/>
    <rect x="128" y="128" width="18" height="62" rx="3"/>
    <rect x="154" y="164" width="18" height="26" rx="3"/>
    <rect x="180" y="112" width="18" height="78" rx="3"/>
  </g>

  <!-- line trend on right side of dashboard -->
  <path d="M214 178 L238 150 L262 162 L292 118" stroke="#12635d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#12635d">
    <circle cx="214" cy="178" r="4"/>
    <circle cx="238" cy="150" r="4"/>
    <circle cx="262" cy="162" r="4"/>
    <circle cx="292" cy="118" r="4"/>
  </g>
  <path d="M214 200 V178 M238 200 V150 M262 200 V162 M292 200 V118" stroke="#12635d" stroke-width="2" stroke-opacity="0.25"/>

  <!-- graduation cap floating above dashboard -->
  <g transform="translate(200,32)">
    <path d="M0 -16 L34 -2 L0 12 L-34 -2 Z" fill="#12635d"/>
    <path d="M-16 5 V20 C-16 28 16 28 16 20 V5" stroke="#12635d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M30 -1 V16" stroke="#12635d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="19" r="3.5" fill="#12635d"/>
  </g>

  <!-- students / users row -->
  <g fill="#12635d" fill-opacity="0.35">
    <circle cx="60" cy="238" r="10"/>
    <path d="M44 268 C44 250 76 250 76 268 Z"/>
    <circle cx="100" cy="238" r="10"/>
    <path d="M84 268 C84 250 116 250 116 268 Z"/>
    <circle cx="140" cy="238" r="10"/>
    <path d="M124 268 C124 250 156 250 156 268 Z"/>
  </g>

  <!-- floating data particles -->
  <g fill="#9a5b13" fill-opacity="0.5">
    <circle cx="340" cy="80" r="5"/>
    <circle cx="356" cy="112" r="4"/>
    <circle cx="330" cy="140" r="4"/>
  </g>
</svg>
