<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- background network nodes representing regional adoption -->
  <g stroke="#12635d" stroke-width="2" stroke-opacity="0.22">
    <path d="M46 56 L96 96 M354 54 L304 94 M46 244 L98 210 M354 246 L302 212"/>
  </g>
  <g fill="#12635d" fill-opacity="0.28">
    <circle cx="46" cy="56" r="6"/>
    <circle cx="354" cy="54" r="6"/>
    <circle cx="46" cy="244" r="6"/>
    <circle cx="354" cy="246" r="6"/>
  </g>

  <!-- central shield -->
  <path d="M200 40 L266 65 V138 C266 188 234 222 200 238 C166 222 134 188 134 138 V65 Z" fill="#12635d" fill-opacity="0.10" stroke="#12635d" stroke-width="6" stroke-linejoin="round"/>

  <!-- maturity gauge inside shield -->
  <g transform="translate(200,150)">
    <path d="M-42 6 A42 42 0 0 1 42 6" stroke="#12635d" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-42 6 A42 42 0 0 1 18 -38" stroke="#9a5b13" stroke-width="7" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="20" y2="-26" stroke="#12635d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="6" fill="#12635d"/>
  </g>

  <!-- checklist (self-assessment) -->
  <g transform="translate(70,140)">
    <rect x="0" y="0" width="58" height="72" rx="8" fill="#9a5b13" fill-opacity="0.10" stroke="#9a5b13" stroke-width="4"/>
    <g stroke="#9a5b13" stroke-width="4" stroke-linecap="round">
      <path d="M10 18 l6 6 l12 -14"/>
      <path d="M10 38 l6 6 l12 -14"/>
      <path d="M10 58 l6 6 l12 -14"/>
    </g>
  </g>

  <!-- toolbox glyph -->
  <g transform="translate(300,178)">
    <rect x="-24" y="0" width="48" height="32" rx="6" fill="#12635d"/>
    <path d="M-12 0 V-10 C-12 -18 12 -18 12 -10 V0" stroke="#12635d" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-6" y="12" width="12" height="8" rx="2" fill="#fbfbf8"/>
  </g>

  <!-- scan waves beneath shield -->
  <g stroke="#12635d" stroke-opacity="0.4" stroke-width="3" fill="none">
    <path d="M170 250 q30 -20 60 0"/>
  </g>
</svg>
